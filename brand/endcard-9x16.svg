<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <!-- End card for YouTube Shorts. Always the last 3 to 4 seconds, with the
       closing narration over it. Made by hand on purpose: this is where the
       real logo and the real address appear, which is why generated scenes
       are forbidden from drawing either. Everything sits inside the middle
       of the frame, clear of the Shorts interface at the bottom and of the
       action buttons down the right edge. -->
  <rect width="1080" height="1920" fill="#1E5C43"/>

  <!-- The logo, inverted so it reads on the green field -->
  <g transform="translate(410,560)">
    <rect width="260" height="260" rx="69" fill="#F7F6F1"/>
    <text x="122" y="185" font-family="Georgia, 'Times New Roman', serif" font-size="175" font-weight="600" fill="#1E5C43" text-anchor="middle">P</text>
    <circle cx="185" cy="162" r="15" fill="#9A7B45"/>
    <rect x="89" y="213" width="81" height="11" rx="5.5" fill="#9A7B45"/>
  </g>

  <!-- Wordmark. The brass here is the lighter tone the site already uses on
       dark grounds (#C4A26A): the #9A7B45 brass fails contrast on green. -->
  <text x="540" y="985" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-weight="600" fill="#F7F6F1" text-anchor="middle" letter-spacing="2">PREP<tspan fill="#C4A26A">.md</tspan></text>

  <!-- Hairline -->
  <rect x="390" y="1060" width="300" height="3" fill="#C4A26A" opacity="0.8"/>

  <!-- The promise -->
  <text x="540" y="1170" font-family="'Segoe UI', Arial, sans-serif" font-size="56" fill="#F7F6F1" text-anchor="middle" opacity="0.92">Continue your projects in any AI.</text>

  <!-- Where to go. This is the whole point of the card, so it is the most
       legible thing on it after the logo: off-white, not brass, with a brass
       rule under it to carry the eye. -->
  <text x="540" y="1355" font-family="Georgia, 'Times New Roman', serif" font-size="94" font-weight="600" fill="#F7F6F1" text-anchor="middle" letter-spacing="1">prep.md</text>
  <rect x="420" y="1390" width="240" height="4" rx="2" fill="#C4A26A"/>
</svg>
